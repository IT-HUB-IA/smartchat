<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM padrão · 8 Funil</title>
<script src="../base/casca.js?v=you1"></script>
<script src="../base/icones.js?v=you1"></script>
<link rel="stylesheet" href="../base/tokens.css?v=you1">
<link rel="stylesheet" href="../base/componentes.css?v=you1">
<link rel="stylesheet" href="08-funil.css?v=you1">
</head>
<body>
<main class="casca-pagina">
  <header class="fn-cabeca">
    <h1>Funil</h1>
    <p class="card-fraco">Arraste um card para outra coluna. Os botões − e + mudam os contatos do lead. Dados de exemplo.</p>
  </header>

  <section class="fn-barra" aria-label="Busca e filtro" data-item="8.17 Filtro do funil (etiqueta da faixa, logo da origem, período)">
    <label class="campo-com-icone fn-busca">
      <svg class="ico" data-anima aria-hidden="true"><use href="#search"/></svg>
      <input class="campo-input" type="search" placeholder="Buscar por nome, empresa ou telefone" aria-label="Buscar lead" id="fn-busca">
    </label>
    <button class="selecao-botao" type="button" popovertarget="fn-filtro" style="anchor-name: --fnfiltro" id="fn-filtro-btn"><svg class="ico" data-anima aria-hidden="true"><use href="#funnel"/></svg><span class="selecao-escolha">Filtro</span><span class="selecao-contador" id="fn-filtro-n" hidden>0</span><svg class="selecao-seta" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
    <div id="fn-filtro" popover class="selecao-pop" style="position-anchor: --fnfiltro"><div class="selecao-lista" id="fn-filtro-lista"></div></div>
  </section>

  <section class="fn-quadro-bloco" data-item="8.1 Quadro do funil (colunas, contador, cards, rolagem)">
    <p class="fn-resumo card-fraco" id="fn-resumo"></p>
    <div class="fn-quadro" id="fn-quadro"></div>
  </section>

  <h2 class="fn-sub">Peças do funil</h2>
  <div class="fn-pecas">
    <figure class="fn-peca"><div class="fn-col-demo" data-item="8.10 Card de lead completo" id="p-normal"></div></figure>
    <figure class="fn-peca"><div class="fn-col-demo" data-item="8.11 Card em destaque (borda no acento)" id="p-destaque"></div></figure>
    <figure class="fn-peca"><div class="fn-col-demo" data-item="8.12 Card com reunião agendada" id="p-reuniao"></div></figure>
    <figure class="fn-peca"><div class="fn-col-demo" data-item="8.13 Card de follow-up (próxima atrasada)" id="p-follow"></div></figure>
    <figure class="fn-peca"><div class="fn-col-demo fn-arrastando-demo" data-item="8.6 Card sendo arrastado (sombra, sem 3D)" id="p-arrasto"></div></figure>
    <figure class="fn-peca"><div class="fn-col-demo" data-item="8.14 Coluna vazia" id="p-vazia"></div></figure>
    <figure class="fn-peca"><div class="fn-col-demo" data-item="8.15 Contador − e + de contatos (estados)" id="p-contador"></div></figure>
    <figure class="fn-peca"><div class="fn-col-demo fn-cabecas" data-item="8.9 Cabeçalho de coluna por etapa" id="p-cabecas"></div></figure>
  </div>
</main>
